# dsh-headless-runtime 镜像发布：上游 @deepseek-ai/dsh 无头执行面
#
# 触发：手动（workflow_dispatch）输入上游 dsh npm 版本；镜像 tag 与版本一致。
# 推送目标：ghcr.io/ai-specs/dsh-headless-runtime:<version>（多架构 amd64/arm64）。
#
# 用法：
#   GitHub → Actions → "Publish dsh headless runtime image" → Run workflow
#   → dsh_version 填上游版本（如 0.1.6-alpha.1）
#
# 与 Kestra flow 的对接：
#   本地开发用 pullPolicy: NEVER + 本地同名镜像（docker build -t dsh-headless-runtime:<version>）；
#   正式部署改为 ghcr.io/ai-specs/dsh-headless-runtime:<version> + pullPolicy: ALWAYS。

name: Publish dsh headless runtime image

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: '上游 @deepseek-ai/dsh npm 版本（镜像 tag 与此一致），如 0.1.6-alpha.1'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/ai-specs/dsh-headless-runtime

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/dsh-headless-runtime
          file: docker/dsh-headless-runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            DSH_VERSION=${{ inputs.dsh_version }}
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:${{ inputs.dsh_version }}
          labels: |
            org.opencontainers.image.title=dsh-headless-runtime
            org.opencontainers.image.description=Upstream @deepseek-ai/dsh headless execution plane
            org.opencontainers.image.source=https://github.com/ai-specs/deepseek-harness
            org.opencontainers.image.version=${{ inputs.dsh_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
