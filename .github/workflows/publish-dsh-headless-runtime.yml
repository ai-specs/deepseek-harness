# dsh-headless-runtime 镜像发布：上游 @deepseek-ai/dsh 无头执行面
#
# 触发：手动（workflow_dispatch）输入上游 dsh npm 版本；镜像 tag 与版本一致。
# 推送目标：ghcr.io/ai-specs/dsh-headless-runtime:<version>（多架构 amd64/arm64）。
#
# ============================================================
# 【版本升级义务 —— 与 docker/dsh-headless-runtime/Dockerfile 同步】
# 本 workflow 发布"上游 @deepseek-ai/dsh" npm 包（build-arg DSH_VERSION），
# 与 fork 自身版本线不一定同步。每次 fork 完成上游 release merge 后，
# 若上游 dist-tags.alpha 已前进，须按 Dockerfile 头部的四步升级流程执行：
#   npm view @deepseek-ai/dsh dist-tags --json  → 比对下方示例/当前 GHCR tag
#   → 更新此处 inputs.dsh_version 描述示例 → 触发本 workflow 发布新 tag。
# 当前已发布基线：0.1.7-rc.1（上游 dist-tags.next，2026-09-24）。
# ============================================================
#
# 用法：
#   GitHub → Actions → "Publish dsh headless runtime image" → Run workflow
#   → dsh_version 填上游版本（如 0.1.7-rc.1）
#
# 与 Kestra flow 的对接：
#   本地开发用 pullPolicy: NEVER + 本地同名镜像（docker build -t dsh-headless-runtime:<version>）；
#   正式部署改为 ghcr.io/ai-specs/dsh-headless-runtime:<version> + pullPolicy: ALWAYS。

name: Publish dsh headless runtime image

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: '上游 @deepseek-ai/dsh npm 版本（镜像 tag 与此一致），如 0.1.7-rc.1'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/ai-specs/dsh-headless-runtime

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker/dsh-headless-runtime
          file: docker/dsh-headless-runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            DSH_VERSION=${{ inputs.dsh_version }}
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:${{ inputs.dsh_version }}
          labels: |
            org.opencontainers.image.title=dsh-headless-runtime
            org.opencontainers.image.description=Upstream @deepseek-ai/dsh headless execution plane
            org.opencontainers.image.source=https://github.com/ai-specs/deepseek-harness
            org.opencontainers.image.version=${{ inputs.dsh_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
